version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
      time: "03:00"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 1
    commit-message:
      prefix: "⬆️"
    assignees:
      - "tomtuv"
    versioning-strategy: increase
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "eslint"
        versions:
          - ">=10.0.0"
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"
